name: Deploy

# Netlify is NOT deployed from here. This repository is linked to Netlify
# directly, so Netlify builds it itself -- from `netlify.toml`, on every
# push and as a Deploy Preview on every pull request. Adding a second
# Netlify deploy here would publish the same site twice on every push,
# racing, and put two previews on every pull request.
#
# Pull requests still build, and that is the part worth keeping: the CMS
# writes frontmatter, `src/content.config.ts` validates it, and a bad save
# should fail the BUILD rather than render a broken page. Catching it on
# the pull request is the whole point of validating it at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the one job that needs more asks for it itself.
# Nothing here can write to the repository's contents, so a merged pull
# request is still the only way content changes.
permissions:
  contents: read

concurrency:
  # Per ref, so a pull request's build check never queues behind a
  # production deploy or the reverse. A superseded CHECK is cancelled --
  # the CMS can push several saves to one branch in a minute and only the
  # last matters -- but a production deploy is never cancelled, because a
  # half-finished one leaves the site down.
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  pages:
    # A pull request builds to be checked, never to be published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
