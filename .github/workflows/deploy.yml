name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages` and `id-token` are what `deploy-pages` needs; `contents: read` is
# all the build needs. Nothing here can write to the repository, so a merged
# pull request is the only way content changes.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-finished one leaves the site down.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
